name: Build installers

# Builds the Windows installer and the two Mac disk images in the cloud (free for public repositories).
# Run it from the "Actions" tab (Run workflow), or push a tag such as v1.0.0 to also publish a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # lets the release step attach the files

jobs:
  windows:
    runs-on: windows-latest
    env:
      # optional code signing: add these as repository secrets (see packaging/PACKAGING.md)
      WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
      WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Install Python packages
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: Prepare the signing certificate (only if the secret exists)
        if: ${{ env.WIN_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          "WIN_CERT_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the installer
        run: python packaging/build.py --models
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*.exe

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple-silicon Macs (M1 and newer)
            name: mac-apple-silicon
          - runner: macos-15-intel  # Intel Macs
            name: mac-intel
    runs-on: ${{ matrix.runner }}
    env:
      # optional code signing + notarization: add these as repository secrets
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Install create-dmg (optional, for a nicer disk-image window)
        run: brew install create-dmg || true
      - name: Install Python packages
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: Import the signing certificate (only if the secret exists)
        if: ${{ env.MAC_CERT_P12_BASE64 != '' }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          echo "CODESIGN_IDENTITY=$MAC_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Build the disk image
        run: python packaging/build.py --models
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
